[package]
name = "dashbeam"
version = "0.7.1"
description = "P2P file sharing with NAT hole punching"
authors = ["Tony Antony"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.91"

[lib]
name = "dashbeam_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
serde_json = "1.0"

[dependencies]
tauri = { version = "=2.10.1", features = ["tray-icon", "image-png"] }
mime_guess="2.0"
base64 = "0.22.1"
image="0.25"
tauri-plugin-dialog = { version = "2.7", default-features = false }
tauri-plugin-opener = "2.5.3"
tauri-plugin-os = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-updater = "2.10"
tauri-plugin-native-utils = { path = "./plugins/tauri-plugin-native-utils" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
n0-watcher = "1.0"
iroh = { version = "1.0.3", features = ["platform-verifier"] }
iroh-blobs = { version = "0.103.1" }
engine = { path = "../engine" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Used only for `non_blocking`: keeps debug-mode file writes off the transfer
# threads so logging cannot perturb hole-punch timing.
tracing-appender = "0.2"
walkdir = "2.4"
tauri-plugin-store = "2.4.2"
tauri-plugin-notification = "2.3.3"
reqwest = "0.13.2"
tauri-plugin-deep-link = "2.4.6"
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["custom-protocol", "default-tls", "dialog-gtk3"]
default-tls = ["reqwest/default-tls"]
custom-protocol = ["tauri/custom-protocol"]
# GTK dialogs by default; the Flatpak build swaps in dialog-xdg-portal.
dialog-gtk3 = ["tauri-plugin-dialog/gtk3"]
dialog-xdg-portal = ["tauri-plugin-dialog/xdg-portal"]
# Flatpak-only: autostart through the XDG Background portal, since the
# autostart plugin would write a .desktop file the host never reads.
# `ashpd` is a Linux-only target dependency, so the module this enables is
# additionally gated on `target_os = "linux"`.
autostart-portal = ["dep:ashpd"]
linux-gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
cargo-clippy = []

[target.'cfg(target_os = "linux")'.dependencies]
# Deliberately 0.11, not the newer 0.13: `rfd` (via tauri-plugin-dialog's
# xdg-portal feature, which the Flatpak build enables) already pulls ashpd
# 0.11 in, so this reuses that copy instead of vendoring a second one.
# The backend is spelled out because ashpd `compile_error!`s if both its
# async-std and tokio features end up enabled; tauri-plugin-dialog selects
# `rfd/tokio`, so tokio is the one that must match.
ashpd = { version = "0.11", optional = true, default-features = false, features = ["tokio"] }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }

# Already pulled by tauri-plugin-notification; direct dep so we can set
# timeout (the plugin does not expose it).
[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
notify-rust = "4.18"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
dunce = "1.0"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_MediaFoundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc = "0.2"
