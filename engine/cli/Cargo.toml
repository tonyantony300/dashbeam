[package]
name = "dashbeam-cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.91"
description = "The dashbeam command: headless agent node daemon and its CLI"

[lib]
name = "dashbeam_cli"
path = "src/lib.rs"

[[bin]]
name = "dashbeam"
path = "src/main.rs"

[dependencies]
dashbeam-agent = { path = "../agent" }
engine = { path = ".." }
clap = { version = "4.4.10", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[dev-dependencies]
rmcp = { version = "=3.8.0", features = ["client"] }
tempfile = "3"
