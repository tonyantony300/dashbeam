[package]
name = "dashbeam-agent"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.91"
description = "Headless DashBeam agent node"

[lib]
name = "agent"

[dependencies]
engine = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
